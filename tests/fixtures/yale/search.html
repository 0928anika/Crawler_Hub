<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 모든 상품 요소를 선택
        var items = document.querySelectorAll('.description');

        items.forEach(function (item) {
            // ec-data-custom과 ec-data-price 값을 가져옴
            var customPrice = parseInt(item.getAttribute('ec-data-custom').replace(/,/g, ''));
            var salePrice = parseInt(item.getAttribute('ec-data-price').replace(/,/g, ''));

            if (customPrice > 0 && salePrice > 0 && customPrice !== salePrice) {
                // 할인율 계산
                var discountRate = Math.round(((customPrice - salePrice) / customPrice) * 100);

                // 할인율 HTML 생성
                var discountHtml = '<span class="discount-text" style="font-size: 12px; color: #ff0000; margin-left: 5px;">' + discountRate + '%</span>';

                // 할인율을 표시할 위치에 추가
                var priceContainer = item.querySelector('.product_price'); // 판매가 위치
                if (priceContainer) {
                    priceContainer.insertAdjacentHTML('beforeend', discountHtml);
                }
            }
        });
    });
</script>
